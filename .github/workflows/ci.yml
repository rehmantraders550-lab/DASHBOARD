name: ORVIA Visualizer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json was cleaned before the lockfiles could be regenerated locally.
      # Avoid treating the stale lockfile as authoritative until it is synchronized.
      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
